# 工作犬综合训练评分卡（P0 + P1 = 16 行为）
# Owner: ML 开发（见 AGENTS.md §2.2）
# Phase: 2.2e
# 依据: dev-docs/research/RESEARCH_STANDARDS.md §4.2 + project-brief.md §7 维评分
# 信号来源: backend/ml/behavior/rule_engine.py（Phase 2.2b P0 8 类 + P1 8 类）
#
# 7 维评分：准确度（0.25）+ 延迟（0.15）+ 保持（0.10）+ 搜索效率（0.20）+
#           注意力（0.10）+ 胆量（0.10）+ 步态（0.10）
#
# 行为 → 评分维度映射（依据 RESEARCH_STANDARDS.md §4.2）:
#   P0:  sit/down/stand → 准确度+延迟+保持; heel → 准确度+步态; stay → 保持;
#        sit_up → 准确度; bark → 注意力; bite → 胆量
#   P1:  track → 搜索效率+注意力; alert_sit/alert_down → 准确度+延迟+注意力;
#        apprehend → 胆量+注意力; escort → 注意力+步态; obstacle → 准确度+步态;
#        recall → 延迟+准确度; watch → 注意力+保持

scoring_engine:
  name: "工作犬综合训练评分卡"
  version: "2.0.0"
  scene: "working_dog_trial"
  description: |
    工作犬综合训练 7 维评分（P0 8 类 + P1 8 类 = 16 类行为）：
    准确度（0.25）+ 延迟（0.15）+ 保持（0.10）+ 搜索效率（0.20）+
    注意力（0.10）+ 胆量（0.10）+ 步态（0.10）
    依据: RESEARCH_STANDARDS.md §4.2 行为→评分映射矩阵

  dimensions:
    # === 准确度（所有 16 行为的执行准确率） ===
    - id: accuracy
      name: "准确度"
      weight: 0.25
      rules:
        - id: accuracy_excellent
          condition: "action_correct / action_count > 0.95"
          score: 90
          label: "优秀"
        - id: accuracy_good
          condition: "action_correct / action_count > 0.80"
          score: 75
          label: "良好"
        - id: accuracy_pass
          condition: "action_correct / action_count > 0.60"
          score: 60
          label: "合格"
        - id: accuracy_fail
          condition: "action_correct / action_count <= 0.60"
          score: 30
          label: "不合格"
        - id: accuracy_default
          condition: "True"
          score: 40
          label: "待评估"

    # === 延迟（指令到动作响应时间，覆盖 recall/alert_sit/alert_down + P0） ===
    - id: latency
      name: "延迟"
      weight: 0.15
      rules:
        - id: latency_excellent
          condition: "command_to_action_latency < 0.5"
          score: 90
          label: "优秀"
        - id: latency_good
          condition: "command_to_action_latency < 1.5"
          score: 75
          label: "良好"
        - id: latency_pass
          condition: "command_to_action_latency < 3.0"
          score: 60
          label: "合格"
        - id: latency_fail
          condition: "command_to_action_latency >= 3.0"
          score: 30
          label: "不合格"
        - id: latency_default
          condition: "True"
          score: 40
          label: "待评估"

    # === 保持（动作持续时间，覆盖 watch/escort/stay） ===
    - id: duration
      name: "保持"
      weight: 0.10
      rules:
        - id: duration_excellent
          condition: "action_duration > 30.0"
          score: 90
          label: "优秀"
        - id: duration_good
          condition: "action_duration > 10.0"
          score: 75
          label: "良好"
        - id: duration_pass
          condition: "action_duration > 3.0"
          score: 60
          label: "合格"
        - id: duration_fail
          condition: "action_duration <= 3.0"
          score: 30
          label: "不合格"
        - id: duration_default
          condition: "True"
          score: 40
          label: "待评估"

    # === 搜索效率（P1 新增，覆盖 track/alert_sit/alert_down 搜索表现） ===
    - id: search_efficiency
      name: "搜索效率"
      weight: 0.20
      rules:
        - id: search_excellent
          condition: "search_coverage > 0.85 and search_speed > 0.5 and target_found"
          score: 90
          label: "优秀"
        - id: search_good
          condition: "search_coverage > 0.60 and search_speed > 0.3"
          score: 75
          label: "良好"
        - id: search_pass
          condition: "search_coverage > 0.40 or target_found"
          score: 60
          label: "合格"
        - id: search_fail
          condition: "search_coverage <= 0.40 and not target_found"
          score: 30
          label: "不合格"
        - id: search_default
          condition: "True"
          score: 40
          label: "待评估"

    # === 注意力（聚焦比例，覆盖 watch/alert_sit/alert_down/apprehend/bark） ===
    - id: attention
      name: "注意力"
      weight: 0.10
      rules:
        - id: attention_high
          condition: "focus_ratio > 0.80"
          score: 90
          label: "高"
        - id: attention_medium
          condition: "focus_ratio > 0.50"
          score: 70
          label: "中"
        - id: attention_low
          condition: "focus_ratio <= 0.50"
          score: 30
          label: "低"
        - id: attention_default
          condition: "True"
          score: 40
          label: "待评估"

    # === 胆量（P1 新增，覆盖 apprehend/escort/bite） ===
    - id: courage
      name: "胆量"
      weight: 0.10
      rules:
        - id: courage_high
          condition: "apprehend_confidence > 0.8 and escort_stability > 0.7"
          score: 90
          label: "高"
        - id: courage_medium
          condition: "apprehend_confidence > 0.5 or escort_stability > 0.5"
          score: 65
          label: "中"
        - id: courage_low
          condition: "apprehend_confidence <= 0.3 and escort_stability <= 0.3"
          score: 25
          label: "低"
        - id: courage_default
          condition: "True"
          score: 40
          label: "待评估"

    # === 步态（覆盖 heel/obstacle/escort 移动质量） ===
    - id: gait
      name: "步态"
      weight: 0.10
      rules:
        - id: gait_excellent
          condition: "gait_score > 0.85"
          score: 90
          label: "优秀"
        - id: gait_good
          condition: "gait_score > 0.70"
          score: 75
          label: "良好"
        - id: gait_pass
          condition: "gait_score > 0.50"
          score: 60
          label: "合格"
        - id: gait_fail
          condition: "gait_score <= 0.50"
          score: 30
          label: "不合格"
        - id: gait_default
          condition: "True"
          score: 40
          label: "待评估"

  thresholds:
    pass: 75        # 合格（达标）
    borderline: 60  # 基本合格（需加强训练）
    fail: 0         # 不合格

  aggregation: "weighted_sum"
