# Alembic configuration for K9 Training Vision System
# Sync DSN (asyncpg not natively supported by Alembic)

[alembic]
script_location = backend/alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql://k9system:K9System2026!@127.0.0.1:5433/k9system

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
