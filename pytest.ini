[pytest]
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    slow: 需要 GPU 或模型下载的慢测试（默认 ml 模块测试自动标记）
    fast: 无需 GPU 的快速测试
    integration: 集成测试（需要真实视频/数据库）
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
